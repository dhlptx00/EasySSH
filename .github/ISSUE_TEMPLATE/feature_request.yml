name: Feature request
description: Suggest something Easy SSH could do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task or situation, not only the feature.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: input
    id: editor
    attributes:
      label: Editor and OS
      placeholder: "Cursor on macOS"
