name: Bug report
description: Something in Easy SSH does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please remove host names, user names and anything secret from logs.
        **Output → Easy SSH** has the extension log.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      placeholder: Steps to reproduce, what you saw, what you expected.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Easy SSH version
      placeholder: "0.2.0"
    validations:
      required: true
  - type: input
    id: editor
    attributes:
      label: Editor and version
      description: VS Code or Cursor, with the version from Help → About.
      placeholder: "VS Code 1.105.0 / Cursor 1.7"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Your OS (where the editor runs)
      options: [Windows, macOS, Linux, Other]
    validations:
      required: true
  - type: input
    id: server
    attributes:
      label: Server OS and login shell
      placeholder: "Ubuntu 24.04, bash 5.2 (or zsh, fish, …)"
    validations:
      required: true
  - type: dropdown
    id: auth
    attributes:
      label: Sign-in method
      options: [Password, Private key, SSH agent, Pageant, Keyboard-interactive / 2FA]
      multiple: true
    validations:
      required: true
  - type: dropdown
    id: jump
    attributes:
      label: Jump host?
      options: ["No", "Yes, one", "Yes, several"]
  - type: textarea
    id: log
    attributes:
      label: Log (Output → Easy SSH)
      render: text
